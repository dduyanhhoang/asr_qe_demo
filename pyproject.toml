[project]
name = "asr-qe-demo"
version = "0.1.0"
description = "Always-on mic -> Silero VAD -> Whisper ASR -> QE -> LLM, side-by-side demo UI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "faster-whisper>=1.1",
    "anthropic>=1.0",
    "soundfile>=0.12",
    "websockets>=12",
]

[tool.setuptools]
packages = ["app"]
